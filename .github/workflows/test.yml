name: Test Package
on: ["pull_request"]

jobs:
    lint:
        name: Prettier formatting and linting check
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash
        steps:
            - name: Enable Corepack
              run: corepack enable

            - name: Checkout code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
                
            - uses: actions/setup-node@v4
              with:
                  node-version: 20.x
            - name: Install dependencies
              run: yarn
            - name: Is formatted and linted
              run: yarn lint
    test:
        name: Run tests
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash
        steps:
            - name: Enable Corepack
              run: corepack enable

            - name: Checkout code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
                
            - uses: actions/setup-node@v4
              with:
                  node-version: 20.x
            - name: Install dependencies
              run: yarn
            - name: Run tests
              run: yarn test